<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Journal ｜ 旅途，慢慢記錄</title>
  <style>
    :root {
      --wabi-bg: #f5f2eb;
      --wabi-card: #ffffff;
      --wabi-ink: #2c2a29;
      --wabi-muted: #8c857b;
      --wabi-line: #e3ded6;
      --wabi-primary: #5c6351;
      --wabi-primary-hover: #4a5041;
      --wabi-accent: #b87a5d;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--wabi-bg); color: var(--wabi-ink); line-height: 1.6; padding: 20px; }
    .max-w-4xl { max-width: 58rem; margin: 0 auto; }
    
    #login-screen {
      max-width: 420px; margin: 100px auto; background: var(--wabi-card); padding: 36px;
      border-radius: var(--radius); border: 1px solid var(--wabi-line); box-shadow: 0 4px 20px rgba(0,0,0,0.03); text-align: center;
    }
    #login-screen h2 { margin-bottom: 8px; font-family: Georgia, serif; font-weight: normal; letter-spacing: 1px; color: var(--wabi-ink); }
    #login-screen p { color: var(--wabi-muted); font-size: 13px; margin-bottom: 24px; }
    #login-screen input { width: 100%; padding: 12px; margin-bottom: 16px; border: 1px solid var(--wabi-line); border-radius: 8px; font-size: 15px; background: #faf9f6; }
    
    #app-screen { display: none; }
    
    header { 
      display: flex; justify-content: space-between; align-items: center; background: var(--wabi-card); 
      padding: 20px 24px; border-radius: var(--radius); border: 1px solid var(--wabi-line); margin-bottom: 24px; 
    }
    .brand-title { font-family: Georgia, serif; font-size: 18px; letter-spacing: 1.5px; line-height: 1.2; }
    
    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 8px;
    }
    .user-badge { font-weight: 500; font-size: 13px; color: var(--wabi-primary); background: #f0f2ee; padding: 6px 14px; border-radius: 20px; }

    .card { background: var(--wabi-card); padding: 24px; border-radius: var(--radius); border: 1px solid var(--wabi-line); margin-bottom: 20px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--wabi-muted); letter-spacing: 0.5px; }
    input[type="text"], input[type="number"], select, textarea { 
      width: 100%; padding: 10px 14px; border: 1px solid var(--wabi-line); border-radius: 8px; font-size: 14px; background: #faf9f6; color: var(--wabi-ink); 
    }
    textarea { resize: vertical; min-height: 70px; }
    
    .toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .toolbar input { flex: 1; min-width: 220px; }
    
    button { background: var(--wabi-primary); color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: background 0.2s; }
    button:hover { background: var(--wabi-primary-hover); }
    button.secondary { background: #eae6df; color: var(--wabi-ink); }
    button.secondary:hover { background: #ded8ce; }

    .day-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
    .day-tab { padding: 8px 16px; border-radius: 20px; background: #eae6df; color: var(--wabi-muted); border: none; cursor: pointer; white-space: nowrap; font-weight: 500; font-size: 13px; }
    .day-tab.active { background: var(--wabi-primary); color: white; }

    .itinerary-item { 
      background: #faf9f6; border: 1px solid var(--wabi-line); padding: 18px; border-radius: 12px; margin-bottom: 14px; 
    }

    .itinerary-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .time-title-group h4 { font-size: 16px; font-weight: 600; color: var(--wabi-ink); margin-bottom: 2px; }

    .action-icons-row { display: flex; align-items: center; gap: 6px; }
    .icon-action-btn { 
      background: #ffffff; border: 1px solid var(--wabi-line); color: var(--wabi-ink); width: 32px; height: 32px; 
      border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; text-decoration: none;
      transition: background 0.15s;
    }
    .icon-action-btn:hover { background: #f0ece3; border-color: var(--wabi-muted); }
    .icon-action-btn.danger-icon { color: #a85a48; }

    .itinerary-content-box { 
      background: #ffffff; border: 1px solid var(--wabi-line); padding: 14px; border-radius: 8px; font-size: 14px; margin-top: 12px; 
      display: flex; flex-direction: column; gap: 8px;
    }
    .location-info-meta { font-size: 12px; color: var(--wabi-muted); display: flex; flex-direction: column; gap: 3px; }
    .map-nav-link { color: var(--wabi-accent); text-decoration: underline; font-weight: 500; cursor: pointer; }
    .map-nav-link:hover { color: #8e583f; }
    .recommend-badge { display: inline-block; background: #f4eae3; color: var(--wabi-accent); font-size: 12px; padding: 3px 8px; border-radius: 6px; font-weight: 500; width: fit-content; }
    .memo-section { font-size: 13px; color: var(--wabi-muted); border-top: 1px dashed var(--wabi-line); padding-top: 6px; }

    .itinerary-image-box { margin-top: 12px; border-radius: 8px; overflow: hidden; border: 1px solid var(--wabi-line); max-height: 220px; background: #eee; }
    .itinerary-image-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
  </style>
</head>
<body>

  <!-- 登入畫面 -->
  <div id="login-screen">
    <h2>✦ 旅途，慢慢記錄</h2>
    <p>輸入您的個人帳號名稱以載入專屬行程</p>
    <input type="text" id="username-input" placeholder="例如：Cassandra" value="Cassandra">
    <button id="login-btn" type="button" style="width: 100%;">進入我的旅程</button>
  </div>

  <!-- 主應用介面 -->
  <div id="app-screen" class="max-w-4xl">
    <header>
      <div>
        <div class="brand-title" id="display-brand-title">TRAVEL JOURNAL</div>
        <small style="color: var(--wabi-muted);">made by Sandra</small>
      </div>
      <div class="header-right">
        <span class="user-badge" id="current-user-display">使用者</span>
        <button class="secondary" id="logout-btn" type="button" style="padding: 4px 12px; font-size: 12px;">切換帳號</button>
      </div>
    </header>

    <div class="card">
      <h3 style="margin-bottom: 14px; font-family: Georgia, serif; font-weight: normal;">🌍 旅程基本設定</h3>
      <div class="grid-2">
        <div>
          <label>旅遊地點 / 國家</label>
          <input type="text" id="trip-destination" placeholder="例如：日本京都 或 地中海郵輪">
        </div>
        <div>
          <label>旅遊天數設定 (天)</label>
          <input type="number" id="trip-days" min="1" value="3">
        </div>
      </div>

      <div class="grid-2" style="margin-top: 12px;">
        <div>
          <label>頁面大標題 (英文/自訂)</label>
          <input type="text" id="custom-brand-title" placeholder="例如：TRAVEL JOURNAL">
        </div>
      </div>
      
      <div style="margin-top: 8px;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: normal; color: var(--wabi-ink);">
          <input type="checkbox" id="is-international" style="width: auto;"> 
          這是國外旅遊（需加註航班或郵輪資訊）
        </label>
      </div>

      <div id="transport-section" style="display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--wabi-line);">
        <div class="grid-2">
          <div>
            <label>交通工具類型</label>
            <select id="transport-type">
              <option value="flight">✈️ 航班資訊</option>
              <option value="cruise">🚢 郵輪資訊</option>
            </select>
          </div>
          <div>
            <label>編號 / 航次與時間</label>
            <input type="text" id="transport-detail" placeholder="例如: CI-102 / 麗星郵輪 14:00 發航">
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom: 14px; font-family: Georgia, serif; font-weight: normal;">📅 每日行程安排</h3>
      
      <div class="toolbar">
        <input type="text" id="search-input" placeholder="🔍 搜尋行程、地點或備註...">
        <button id="add-item-btn" type="button">＋ 新增行程</button>
      </div>

      <div class="day-tabs" id="day-tabs-container"></div>
      <div id="itinerary-list"></div>
    </div>
  </div>

  <!-- 新增/編輯行程互動小視窗 -->
  <div id="modal-backdrop" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(44,42,41,0.4); justify-content:center; align-items:center; z-index:999; backdrop-filter: blur(2px);">
    <div style="background:var(--wabi-card); padding:28px; border-radius:var(--radius); width:90%; max-width:480px; border: 1px solid var(--wabi-line); max-height: 85vh; overflow-y: auto;">
      <h3 id="modal-title" style="margin-bottom: 16px; font-family: Georgia, serif; font-weight: normal;">新增行程</h3>
      <input type="hidden" id="edit-index" value="-1">
      
      <div class="grid-2" style="margin-bottom: 0;">
        <div style="margin-bottom: 12px;">
          <label>時間 / 時段</label>
          <input type="text" id="item-time" placeholder="例如: 10:00 AM">
        </div>
        <div style="margin-bottom: 12px;">
          <label>外部網址連結 (選填)</label>
          <input type="text" id="item-link" placeholder="https://...">
        </div>
      </div>

      <div style="margin-bottom: 12px;">
        <label>地點名稱（如為景點／餐廳將自動帶入資訊）</label>
        <input type="text" id="item-title" placeholder="例如：出發！ 或 清水寺、老爹蔬食">
      </div>

      <div style="margin-bottom: 12px;">
        <label>營業時間（可自行編輯填寫）</label>
        <input type="text" id="item-hours" placeholder="例如：09:00 - 18:00 (週一公休)">
      </div>

      <div style="margin-bottom: 12px;">
        <label>文字行程 / 備註描述（若空白自動隱藏）</label>
        <textarea id="item-desc" placeholder="例如：品嚐人氣抹茶甜點，欣賞日式庭園建築"></textarea>
      </div>

      <div style="margin-bottom: 12px;">
        <label>熱門必吃 / 必買推薦（若空白自動隱藏）</label>
        <input type="text" id="item-recommend" placeholder="例如：招牌抹茶泡芙、手工紀念品">
      </div>

      <div style="margin-bottom: 12px;">
        <label>備忘欄（自行填寫，若空白自動隱藏）</label>
        <input type="text" id="item-memo" placeholder="例如：記得提前預約、攜帶門票憑證">
      </div>

      <div style="margin-bottom: 24px;">
        <label>照片網址 / 圖片連結 (選填)</label>
        <input type="text" id="item-image" placeholder="https://... (圖片網址)">
      </div>

      <div style="display: flex; gap: 10px; justify-content: flex-end; padding-bottom: 20px;">
        <button class="secondary" id="modal-cancel-btn" type="button">取消</button>
        <button id="modal-save-btn" type="button">儲存行程</button>
      </div>
    </div>
  </div>

  <script>
    let currentUser = localStorage.getItem('current_user') || '';
    let currentDay = 1;
    let appData = {
      destination: '',
      days: 3,
      brandTitle: 'TRAVEL JOURNAL',
      isInternational: false,
      transportType: 'flight',
      transportDetail: '',
      itineraries: {} 
    };

    window.addEventListener('DOMContentLoaded', () => {
      const loginBtn = document.getElementById('login-btn');
      if (loginBtn) loginBtn.onclick = handleLogin;

      const logoutBtn = document.getElementById('logout-btn');
      if (logoutBtn) logoutBtn.onclick = handleLogout;

      const tripDest = document.getElementById('trip-destination');
      if (tripDest) tripDest.oninput = saveAppData;

      const tripDays = document.getElementById('trip-days');
      if (tripDays) {
        tripDays.oninput = () => { updateTripDaysConfig(); saveAppData(); };
      }

      const customBrand = document.getElementById('custom-brand-title');
      if (customBrand) {
        customBrand.oninput = (e) => {
          appData.brandTitle = e.target.value || 'TRAVEL JOURNAL';
          const brandEl = document.getElementById('display-brand-title');
          if (brandEl) brandEl.innerText = appData.brandTitle;
          saveAppData();
        };
      }

      const isInter = document.getElementById('is-international');
      if (isInter) {
        isInter.onchange = () => { toggleInternationalFields(); saveAppData(); };
      }

      const transType = document.getElementById('transport-type');
      if (transType) transType.onchange = saveAppData;

      const transDetail = document.getElementById('transport-detail');
      if (transDetail) transDetail.oninput = saveAppData;

      const addItemBtn = document.getElementById('add-item-btn');
      if (addItemBtn) addItemBtn.onclick = openAddModal;

      const modalCancel = document.getElementById('modal-cancel-btn');
      if (modalCancel) modalCancel.onclick = closeModal;

      const modalSave = document.getElementById('modal-save-btn');
      if (modalSave) modalSave.onclick = saveItineraryItem;

      let isComposing = false;
      const searchInput = document.getElementById('search-input');
      if (searchInput) {
        searchInput.addEventListener('compositionstart', () => { isComposing = true; });
        searchInput.addEventListener('compositionend', (e) => { isComposing = false; renderItineraries(e.target.value); });
        searchInput.addEventListener('input', (e) => { if (!isComposing) renderItineraries(e.target.value); });
      }

      if (currentUser && currentUser.trim() !== '') {
        initAppScreen();
      }
    });

    function handleLogin() {
      const inputEl = document.getElementById('username-input');
      const input = inputEl ? inputEl.value.trim() : '';
      if (!input) {
        alert('請輸入您的帳號名稱');
        return;
      }
      currentUser = input;
      localStorage.setItem('current_user', currentUser);
      initAppScreen();
    }

    function initAppScreen() {
      const loginScreen = document.getElementById('login-screen');
      const appScreen = document.getElementById('app-screen');
      const userDisplay = document.getElementById('current-user-display');

      if (loginScreen) loginScreen.style.display = 'none';
      if (appScreen) appScreen.style.display = 'block';
      if (userDisplay) userDisplay.innerText = currentUser;
      loadAppData();
    }

    function handleLogout() {
      localStorage.removeItem('current_user');
      location.reload();
    }

    function saveAppData() {
      if (!currentUser) return;
      const destEl = document.getElementById('trip-destination');
      const daysEl = document.getElementById('trip-days');
      const brandEl = document.getElementById('custom-brand-title');
      const interEl = document.getElementById('is-international');
      const tTypeEl = document.getElementById('transport-type');
      const tDetailEl = document.getElementById('transport-detail');

      appData.destination = destEl ? destEl.value : '';
      appData.days = daysEl ? (parseInt(daysEl.value) || 3) : 3;
      appData.brandTitle = brandEl ? (brandEl.value || 'TRAVEL JOURNAL') : 'TRAVEL JOURNAL';
      appData.isInternational = interEl ? interEl.checked : false;
      appData.transportType = tTypeEl ? tTypeEl.value : 'flight';
      appData.transportDetail = tDetailEl ? tDetailEl.value : '';
      
      localStorage.setItem(`travel_app_data_${currentUser}`, JSON.stringify(appData));
    }

    function loadAppData() {
      const saved = localStorage.getItem(`travel_app_data_${currentUser}`);
      if (saved) {
        try {
          appData = JSON.parse(saved);
          const destEl = document.getElementById('trip-destination');
          const daysEl = document.getElementById('trip-days');
          const brandInputEl = document.getElementById('custom-brand-title');
          const brandDisplayEl = document.getElementById('display-brand-title');
          const interEl = document.getElementById('is-international');
          const tTypeEl = document.getElementById('transport-type');
          const tDetailEl = document.getElementById('transport-detail');

          if (destEl) destEl.value = appData.destination || '';
          if (daysEl) daysEl.value = appData.days || 3;
          if (brandInputEl) brandInputEl.value = appData.brandTitle || 'TRAVEL JOURNAL';
          if (brandDisplayEl) brandDisplayEl.innerText = appData.brandTitle || 'TRAVEL JOURNAL';
          if (interEl) interEl.checked = !!appData.isInternational;
          if (tTypeEl) tTypeEl.value = appData.transportType || 'flight';
          if (tDetailEl) tDetailEl.value = appData.transportDetail || '';
        } catch(e) {}
      }
      toggleInternationalFields();
      updateTripDaysConfig();
      renderItineraries();
    }

    function toggleInternationalFields() {
      const interEl = document.getElementById('is-international');
      const transSec = document.getElementById('transport-section');
      if (interEl && transSec) {
        transSec.style.display = interEl.checked ? 'block' : 'none';
      }
    }

    function updateTripDaysConfig() {
      const daysEl = document.getElementById('trip-days');
      const totalDays = daysEl ? (parseInt(daysEl.value) || 1) : 1;
      const container = document.getElementById('day-tabs-container');
      if (!container) return;

      container.innerHTML = '';
      if (currentDay > totalDays) currentDay = 1;

      for (let i = 1; i <= totalDays; i++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `day-tab ${i === currentDay ? 'active' : ''}`;
        btn.innerText = `第 ${i} 日`;
        btn.onclick = () => {
          currentDay = i;
          updateTripDaysConfig();
          renderItineraries();
        };
        container.appendChild(btn);
      }
      renderItineraries();
    }

    function renderItineraries(filterKeyword = '') {
      const listContainer = document.getElementById('itinerary-list');
      if (!listContainer) return;
      listContainer.innerHTML = '';
      
      const dayKey = `day_${currentDay}`;
      if (!appData.itineraries[dayKey]) {
        appData.itineraries[dayKey] = [];
      }

      const items = appData.itineraries[dayKey];
      const filtered = items.filter(item => 
        item.title.toLowerCase().includes(filterKeyword.toLowerCase()) || 
        (item.desc && item.desc.toLowerCase().includes(filterKeyword.toLowerCase())) ||
        item.time.toLowerCase().includes(filterKeyword.toLowerCase())
      );

      if (filtered.length === 0) {
        listContainer.innerHTML = `<p style="text-align:center; color: var(--wabi-muted); padding: 24px; font-size: 14px;">尚無行程紀錄，點擊上方「＋ 新增行程」開始規劃！</p>`;
        return;
      }

      filtered.forEach((item) => {
        const realIndex = items.indexOf(item);
        const div = document.createElement('div');
        div.className = 'itinerary-item';
        
        const isPlace = item.title && !['出發', '出發！', '集合', '解散', '賦歸'].includes(item.title.trim());
        const simulatedAddress = `地址：${item.title} 附近熱門商圈`;
        const displayHours = item.hours ? `營業時間：${item.hours}` : `營業時間：09:00 - 18:00`;
        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.title)}`;

        const hasContent = item.desc || isPlace || item.recommend || item.memo || item.hours;

        div.innerHTML = `
          <div class="itinerary-header">
            <div class="time-title-group">
              <h4>🕒 ${item.time} ｜ ${item.title}</h4>
            </div>
            <div class="action-icons-row">
              ${item.link ? `<a href="${item.link}" target="_blank" class="icon-action-btn" title="外部連結">🔗</a>` : ''}
              <button class="icon-action-btn move-up-btn" type="button" data-index="${realIndex}" title="往上移">🔺</button>
              <button class="icon-action-btn move-down-btn" type="button" data-index="${realIndex}" title="往下移">🔻</button>
              <button class="icon-action-btn edit-btn" type="button" data-index="${realIndex}" title="編輯行程">✏️</button>
              <button class="icon-action-btn danger-icon delete-btn" type="button" data-index="${realIndex}" title="刪除行程">🗑️</button>
            </div>
          </div>

          ${hasContent ? `
            <div class="itinerary-content-box">
              ${item.desc ? `<div style="font-weight: 500;">${item.desc}</div>` : ''}
              
              ${isPlace ? `
                <div class="location-info-meta">
                  <span>⏱ ${displayHours}</span>
                  <span>📍 <a href="${mapUrl}" target="_blank" class="map-nav-link" title="點擊一鍵導航">${simulatedAddress} (點擊一鍵導航)</a></span>
                </div>
              ` : ''}

              ${item.recommend ? `<div class="recommend-badge">✨ 推薦：${item.recommend}</div>` : ''}

              ${item.memo ? `<div class="memo-section">📝 備忘：${item.memo}</div>` : ''}
            </div>
          ` : ''}

          ${item.image ? `
            <div class="itinerary-image-box">
              <img src="${item.image}" alt="行程圖片" onerror="this.style.display='none'">
            </div>
          ` : ''}
        `;

        listContainer.appendChild(div);
      });

      listContainer.querySelectorAll('.move-up-btn').forEach(btn => {
        btn.onclick = (e) => moveItem(parseInt(e.currentTarget.dataset.index), -1);
      });
      listContainer.querySelectorAll('.move-down-btn').forEach(btn => {
        btn.onclick = (e) => moveItem(parseInt(e.currentTarget.dataset.index), 1);
      });
      listContainer.querySelectorAll('.edit-btn').forEach(btn => {
        btn.onclick = (e) => openEditModal(parseInt(e.currentTarget.dataset.index));
      });
      listContainer.querySelectorAll('.delete-btn').forEach(btn => {
        btn.onclick = (e) => deleteItem(parseInt(e.currentTarget.dataset.index));
      });
    }

    function moveItem(index, direction) {
      const dayKey = `day_${currentDay}`;
      const items = appData.itineraries[dayKey];
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= items.length) return;
      
      const temp = items[index];
      items[index] = items[targetIndex];
      items[targetIndex] = temp;

      saveAppData();
      renderItineraries();
    }

    function openAddModal() {
      document.getElementById('modal-title').innerText = '新增行程';
      document.getElementById('edit-index').value = '-1';
      document.getElementById('item-time').value = '';
      document.getElementById('item-link').value = '';
      document.getElementById('item-title').value = '';
      document.getElementById('item-hours').value = '';
      document.getElementById('item-desc').value = '';
      document.getElementById('item-recommend').value = '';
      document.getElementById('item-memo').value = '';
      document.getElementById('item-image').value = '';
      document.getElementById('modal-backdrop').style.display = 'flex';
    }

    function openEditModal(index) {
      const dayKey = `day_${currentDay}`;
      const item = appData.itineraries[dayKey][index];
      document.getElementById('modal-title').innerText = '編輯行程';
      document.getElementById('edit-index').value = index;
      document.getElementById('item-time').value = item.time || '';
      document.getElementById('item-link').value = item.link || '';
      document.getElementById('item-title').value = item.title || '';
      document.getElementById('item-hours').value = item.hours || '';
      document.getElementById('item-desc').value = item.desc || '';
      document.getElementById('item-recommend').value = item.recommend || '';
      document.getElementById('item-memo').value = item.memo || '';
      document.getElementById('item-image').value = item.image || '';
      document.getElementById('modal-backdrop').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal-backdrop').style.display = 'none';
    }

    function saveItineraryItem() {
      const index = parseInt(document.getElementById('edit-index').value);
      const time = document.getElementById('item-time').value;
      const link = document.getElementById('item-link').value;
      const title = document.getElementById('item-title').value;
      const hours = document.getElementById('item-hours').value;
      const desc = document.getElementById('item-desc').value;
      const recommend = document.getElementById('item-recommend').value;
      const memo = document.getElementById('item-memo').value;
      const image = document.getElementById('item-image').value;

      if (!title && !desc) {
        alert('請至少輸入行程名稱或備註描述');
        return;
      }

      const dayKey = `day_${currentDay}`;
      if (!appData.itineraries[dayKey]) appData.itineraries[dayKey] = [];

      const itemData = { time, link, title, hours, desc, recommend, memo, image };

      if (index === -1) {
        appData.itineraries[dayKey].push(itemData);
      } else {
        appData.itineraries[dayKey][index] = itemData;
      }

      saveAppData();
      closeModal();
      renderItineraries();
    }

    function deleteItem(index) {
      if (!confirm('確定要刪除這個行程嗎？')) return;
      const dayKey = `day_${currentDay}`;
      appData.itineraries[dayKey].splice(index, 1);
      saveAppData();
      renderItineraries();
    }
  </script>
</body>
</html>
